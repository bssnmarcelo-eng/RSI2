[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rsi2-backtester"
version = "0.2.0"
description = "Backtester de reversão à média com RSI e padrões de candle"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.30",
  "pandas>=2.0",
  "numpy>=1.24",
  "plotly>=5.18",
  "yfinance>=0.2",
]

[project.optional-dependencies]
norgate = ["norgatedata>=1.0.74; platform_system == 'Windows'"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "httpx>=0.28"]
api = ["fastapi>=0.116,<1", "uvicorn[standard]>=0.35,<1", "pydantic>=2.11,<3"]

[tool.setuptools.packages.find]
include = ["src*", "ui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
