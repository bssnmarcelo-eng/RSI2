[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "etf-alpha-lab"
version = "0.1.0"
description = "ETF-only, unlevered multi-strategy research and IBKR execution lab"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "plotly>=5.18",
  "streamlit>=1.30",
  "norgatedata>=1.0.74; platform_system == 'Windows'",
]

[project.optional-dependencies]
ibkr = ["ib_async>=2.0.1"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
